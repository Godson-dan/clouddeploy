name: Build and Scan Images

on:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-scan:
    name: Build and Scan Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_PREFIX/clouddeploy-backend:${{ steps.meta.outputs.tag }} \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL=/api \
            -t $REGISTRY/$IMAGE_PREFIX/clouddeploy-frontend:${{ steps.meta.outputs.tag }} \
            ./frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/clouddeploy-backend:${{ steps.meta.outputs.tag }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/clouddeploy-frontend:${{ steps.meta.outputs.tag }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push backend image
        run: |
          docker push \
            $REGISTRY/$IMAGE_PREFIX/clouddeploy-backend:${{ steps.meta.outputs.tag }}

      - name: Push frontend image
        run: |
          docker push \
            $REGISTRY/$IMAGE_PREFIX/clouddeploy-frontend:${{ steps.meta.outputs.tag }}