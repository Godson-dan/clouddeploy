
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clouddeploy-backend
  namespace: clouddeploy
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: clouddeploy-backend
  template:
    metadata:
      labels:
        app: clouddeploy-backend
    spec:
      containers:
        - name: backend
          image: temigodson/clouddeploy-backend:master
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4000"
            - name: DATABASE_SSL
              value: "true"
            - name: DATABASE_SSL_CA_FILE
              value: /app/certs/rds-us-east-1-bundle.pem
            - name: FRONTEND_URL
              value: "https://clouddeploy.name.ng"
            - name: ENVIRONMENT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: clouddeploy-runtime-secrets
                  key: ENVIRONMENT_ENCRYPTION_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: clouddeploy-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /api/live
              port: 4000
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/live
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 20
