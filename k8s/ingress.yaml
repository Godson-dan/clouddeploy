apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clouddeploy
  namespace: clouddeploy
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # Matches the Terraform-managed security group name. Terraform controls its ingress CIDRs.
    alb.ingress.kubernetes.io/security-groups: "clouddeploy-alb-sg"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: "/"
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - clouddeploy.name.ng
  rules:
    - host: clouddeploy.name.ng
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clouddeploy-frontend
                port:
                  number: 80
