
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clouddeploy-frontend
  namespace: clouddeploy
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: clouddeploy-frontend
  template:
    metadata:
      labels:
        app: clouddeploy-frontend
    spec:
      containers:
        - name: frontend
          image: temigodson/clouddeploy-frontend:master
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
